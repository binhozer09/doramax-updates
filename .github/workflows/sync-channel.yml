name: Atualizar vídeos do canal Choque de Drama
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-channel.yml'
permissions:
  contents: write
concurrency:
  group: sync-choque-de-drama
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Buscar catálogo público completo do canal
        run: |
          yt-dlp --flat-playlist --dump-single-json --no-warnings --extractor-args "youtube:player_client=android" "https://www.youtube.com/@choquededrama/videos" > channel.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          channel_id = "UCVRGRH2goft4HQ6fWkq-j7g"
          with open("channel.json", encoding="utf-8") as f:
              data = json.load(f)
          videos = []
          seen = set()
          for item in data.get("entries") or []:
              if not item:
                  continue
              video_id = item.get("id")
              if not video_id or video_id in seen:
                  continue
              seen.add(video_id)
              videos.append({
                  "id": video_id,
                  "title": item.get("title") or "Vídeo do canal Choque de Drama",
                  "published": item.get("upload_date") or ""
              })
          if not videos:
              raise SystemExit("O YouTube não retornou vídeos; catálogo anterior preservado.")
          catalog = {
              "channelId": channel_id,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "videos": videos
          }
          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write("\\n")
          print(f"Catálogo atualizado no formato compatível: {len(videos)} vídeos.")
          PY
      - name: Validar formato do catálogo
        run: |
          python - <<'PY'
          import json
          with open("videos.json", encoding="utf-8") as f:
              data = json.load(f)
          assert isinstance(data, dict), "Catálogo precisa ser um objeto JSON."
          assert data.get("channelId"), "channelId ausente."
          assert isinstance(data.get("videos"), list) and data["videos"], "Lista videos vazia ou inválida."
          assert all(isinstance(v, dict) and v.get("id") for v in data["videos"]), "Há vídeo sem ID."
          print(f"Validação OK: {len(data['videos'])} vídeos.")
          PY
      - name: Publicar catálogo
        run: |
          rm -f channel.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          if git diff --cached --quiet; then
            echo "Catálogo já está atualizado."
          else
            git commit -m "Atualizar catálogo completo Choque de Drama"
            git push
          fi
